name: Build Repo and Deploy Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "Packages"
      - "Packages.bz2"
      - "Packages.xz"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: main

      - name: Ensure dpkg-scanpackages
        run: |
          if ! command -v dpkg-scanpackages >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq dpkg-dev
          fi
          dpkg-scanpackages --version | head -1

      - name: Rebuild packages
        run: |
          set -euo pipefail
          sudo dpkg-scanpackages -m . /dev/null > Packages
          bash .github/repodock/enrich-index.sh
          bzip2 -c Packages > Packages.bz2
          xz -c Packages > Packages.xz
          echo "Index entries: $(grep -c '^Package:' Packages || true)"

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.bz2 Packages.xz

          if git diff --cached --quiet; then
            echo "unchanged, skipping commit"
          else
            git commit -m "Auto-update package index [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@main

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@main
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@main
