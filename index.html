        .dep-link { padding: 0; border: 0; background: none; color: var(--accent-bright); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 2px; }
        .screenshots { display: flex; gap: 9px; overflow-x: auto; padding: 2px 0 8px; scroll-snap-type: x mandatory; }
        .screenshots img { width: 126px; height: 214px; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 13px; object-fit: cover; scroll-snap-align: start; }
        .version-list { display: grid; gap: 8px; margin-top: 8px; }
        .version-item {
            width: 100%;
            min-height: 58px;
            display: flex;
            align-items: center;

            gap: 12px;
            padding: 12px 14px;

        .version-download-icon .icon { width: 17px; height: 17px; }
        .modal-bottom-actions { display: grid; gap: 8px; margin-top: 16px; }
        .modal-action {
            min-height: 43px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: var(--input);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            font-weight: 650;
        }
        .modal-action.accent { border-color: var(--line-strong); background: var(--accent-soft); color: var(--accent-bright); }
        .modal-action .icon { width: 15px; height: 15px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

        @media (min-width: 700px) {
            .page-shell { max-width: 620px; padding-top: 28px; padding-bottom: 40px; }
            .hero { padding-top: 54px; padding-bottom: 34px; }

        @media (max-width: 390px) {

        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>

    <div class="toast" id="toast" role="status" aria-live="polite">已复制到剪贴板</div>

    <script>
        const REPO_BASE = 'https://wwg151.github.io/';
        let allPackages = [];
        let currentDetailPkg = null;
        let currentVersionPkg = null;
        let downloadCounts = {};
        let currentSort = 'name';
        let pkgDates = {};
        let toastTimer = null;
        let lastFocusedElement = null;

        const $ = (selector) => document.querySelector(selector);
        const svgIcon = (name, extraClass = '') => `<svg class="icon ${extraClass}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
        const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));

        function syncTheme() {
            const theme = document.documentElement.getAttribute('data-theme') || 'dark';
            const toggle = $('#themeToggle');
            toggle.setAttribute('aria-label', theme === 'dark' ? '切换到浅色主题' : '切换到深色主题');
            $('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#070a12' : '#edf2f9');
        }

        function toggleTheme() {
            const root = document.documentElement;
            const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('repo-theme', next); } catch (e) {}
            syncTheme();
        }

        function showToast(message) {
            const toast = $('#toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        async function copyText(text, successMessage) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
                    document.body.appendChild(textarea);
                    textarea.select();
                    const copied = document.execCommand('copy');
                    textarea.remove();
                    if (!copied) throw new Error('Copy failed');
                }
                showToast(successMessage);
            } catch (e) {
                showToast('复制失败，请手动复制');
            }
        }

        function formatSize(bytes) {
            if (bytes === null || bytes === undefined || bytes === '') return '';
            const value = parseFloat(bytes);
            if (Number.isNaN(value)) return '';
            if (value >= 1073741824) return (value / 1073741824).toFixed(2) + ' GB';
            if (value >= 1048576) return (value / 1048576).toFixed(1) + ' MB';
            if (value >= 1024) return (value / 1024).toFixed(1) + ' KB';
            return Math.round(value) + ' B';
        }

        function formatInstalledSize(kb) {
            if (!kb) return '';
            const value = parseFloat(kb);
            return Number.isNaN(value) ? '' : formatSize(value * 1024);
        }

        function compareVersions(a, b) {
            const partsA = String(a || '').split(/[._-]/);
            const partsB = String(b || '').split(/[._-]/);
            const length = Math.max(partsA.length, partsB.length);
            for (let index = 0; index < length; index++) {
                const numberA = parseInt(partsA[index], 10) || 0;
                const numberB = parseInt(partsB[index], 10) || 0;
                if (numberA !== numberB) return numberB - numberA;
            }
            return 0;
        }

        async function loadPkgDates() {
            try {
                const response = await fetch('dates.json', { cache: 'no-cache' });
                if (!response.ok) return;
                pkgDates = (await response.json()) || {};
            } catch (e) {
                pkgDates = {};
            }
        }

        function fileDate(filename) {
            if (!filename || !pkgDates) return '';
            const path = String(filename).replace(/^(\.\/|\/)+/, '');
            let decoded = path;
            try { decoded = decodeURIComponent(path); } catch (e) {}
            return pkgDates[decoded] || pkgDates[path] || pkgDates[filename] || '';
        }

        function packageDate(pkg) {
            let latest = '';
            (pkg.versions || []).forEach(version => {
                const date = fileDate(version.filename);
                if (date && date > latest) latest = date;
            });
            return latest;
        }

        function parseDepends(dependsString) {
            if (!dependsString) return [];
            return dependsString.split(',').map(item => {
                const match = item.trim().match(/^([a-zA-Z0-9_+.\-]+)/);
                return match ? match[1] : null;
            }).filter(Boolean);
        }

        function parsePackages(text) {
            const packages = [];
            text.replace(/\r\n/g, '\n').split('\n\n').forEach(block => {
                if (!block.trim()) return;
                const pkg = {};
                let currentKey = '';
                block.split('\n').forEach(line => {
                    if (line.startsWith(' ') && currentKey) {
                        pkg[currentKey] += '\n' + line.trim();
                        return;
                    }
                    const separator = line.indexOf(':');
                    if (separator === -1) return;
                    const key = line.substring(0, separator).trim();
                    pkg[key] = line.substring(separator + 1).trim();
                    currentKey = key;
                });
                if (!pkg.Package) return;
                const item = {
                    name: pkg.Package,
                    displayName: pkg.Name || pkg.Package,
                    desc: pkg.Description || '',
                    section: pkg.Section || '未分类',
                    author: pkg.Author || '',
                    icon: pkg.Icon || '',
                    screenshots: pkg.Screenshots ? pkg.Screenshots.split('\n').map(value => value.trim()).filter(Boolean) : [],
                    versions: []
                };
                const version = {};
                if (pkg.Version) version.version = pkg.Version;
                if (pkg.Architecture) version.arch = pkg.Architecture;
                if (pkg.Filename) version.filename = pkg.Filename;
                if (pkg.Depends) version.depends = pkg.Depends;
                if (pkg.Size) version.downloadSize = pkg.Size;
                if (pkg['Installed-Size']) version.installedSize = pkg['Installed-Size'];
                item.versions.push(version);
                packages.push(item);
            });
            return packages;
        }

        async function loadPackages() {
            try {
                const response = await fetch('Packages', { cache: 'no-cache' });
                if (!response.ok) throw new Error('Failed to load Packages');
                const rawPackages = parsePackages(await response.text());
                const packageMap = new Map();
                rawPackages.forEach(pkg => {
                    if (!packageMap.has(pkg.name)) {
                        packageMap.set(pkg.name, pkg);
                    } else {
                        packageMap.get(pkg.name).versions.push(...pkg.versions);
                    }
                });
                allPackages = Array.from(packageMap.values());
                allPackages.forEach(pkg => pkg.versions.sort((a, b) => compareVersions(a.version, b.version)));
                $('#pkgCount').textContent = `共 ${allPackages.length} 个包`;
                populateFilters();
                applyFilters();
                loadDownloadCounts();

                const deepPackage = new URLSearchParams(location.search).get('pkg');
                if (deepPackage && allPackages.some(pkg => pkg.name === deepPackage)) {
                    setTimeout(() => showDetailModal(deepPackage), 200);
                }
            } catch (e) {
                $('#pkgCount').textContent = '共 0 个包';
                $('#pkgList').innerHTML = '<div class="empty-state">无法加载插件包列表，请稍后刷新重试</div>';
            }
        }

        function populateFilters() {
            const sections = [...new Set(allPackages.map(pkg => pkg.section))].sort((a, b) => a.localeCompare(b));
            const architectures = [...new Set(allPackages.flatMap(pkg => pkg.versions.map(version => version.arch).filter(Boolean)))].sort();
            const sectionSelect = $('#sectionFilter');
            const archSelect = $('#archFilter');
            sectionSelect.innerHTML = '<option value="">全部分类</option>';
            archSelect.innerHTML = '<option value="">全部架构</option>';
            sections.forEach(section => {
                const option = document.createElement('option');
                option.value = section;
                option.textContent = section;
                sectionSelect.appendChild(option);
            });
            architectures.forEach(architecture => {
                const option = document.createElement('option');
                option.value = architecture;
                option.textContent = architecture;
                archSelect.appendChild(option);
            });
        }

        function setSort(sort) {
            currentSort = sort;
            document.querySelectorAll('.sort-btn').forEach(button => {
                const active = button.dataset.sort === sort;
                button.classList.toggle('active', active);
                button.setAttribute('aria-pressed', String(active));
            });
            applyFilters();
        }

        function applyFilters() {
            const keyword = $('#searchInput').value.trim().toLowerCase();
            const section = $('#sectionFilter').value;
            const architecture = $('#archFilter').value;
            let filtered = allPackages.filter(pkg => {
                if (section && pkg.section !== section) return false;
                if (architecture && !pkg.versions.some(version => version.arch === architecture)) return false;
                if (!keyword) return true;
                return [pkg.name, pkg.displayName, pkg.desc].some(value => String(value || '').toLowerCase().includes(keyword));
            });
            if (currentSort === 'new') {
                filtered.sort((a, b) => {
                    const dateA = packageDate(a);
                    const dateB = packageDate(b);
                    if (dateA === dateB) return a.name.localeCompare(b.name);
                    if (!dateA) return 1;
                    if (!dateB) return -1;
                    return dateB.localeCompare(dateA);
                });
            } else {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            }
            renderPackageList(filtered);
        }

        function renderIcon(pkg, large = false) {
            const image = pkg.icon ? `<img src="${escapeHtml(pkg.icon)}" alt="" loading="lazy" onerror="this.remove()">` : '';
            return `<div class="pkg-icon${large ? ' large' : ''}">${svgIcon('cube')}${image}</div>`;
        }

        function renderPackageList(packages) {
            const list = $('#pkgList');
            if (!packages.length) {
                list.innerHTML = `<div class="empty-state">${allPackages.length ? '没有匹配的插件包' : '暂无可显示的插件包'}</div>`;
                return;
            }
            list.innerHTML = packages.map(pkg => {
                const latest = pkg.versions[0] || {};
                const versionCount = pkg.versions.length;
                const buttonText = versionCount > 1 ? `下载 (${versionCount})` : '下载';
                const size = latest.downloadSize ? formatSize(latest.downloadSize) : '';
                const count = downloadCounts[pkg.name] || 0;
                const meta = [
                    `v${latest.version || '?'}`,
                    pkg.section,
                    latest.arch || '',
                    size,
                    count > 0 ? `↓${count}` : ''
                ].filter(Boolean);
                return `
                    <article class="pkg-card" data-package="${escapeHtml(pkg.name)}">
                        ${renderIcon(pkg)}
                        <button class="pkg-info" type="button" data-action="detail" aria-label="查看 ${escapeHtml(pkg.displayName)} 详情">
                            <span class="pkg-name">${escapeHtml(pkg.displayName)}</span>
                            ${pkg.desc ? `<span class="pkg-desc">${escapeHtml(pkg.desc)}</span>` : ''}
                            <span class="pkg-meta">${meta.map(item => `<span>${escapeHtml(item)}</span>`).join('')}</span>
                        </button>
                        <button class="pkg-download-btn" type="button" data-action="download">${svgIcon('download')}${escapeHtml(buttonText)}</button>
                    </article>`;
            }).join('');
        }

        async function loadDownloadCounts() {
            const packages = [...allPackages];
            for (const pkg of packages) {
                try {
                    const response = await fetch(`https://api.counterapi.dev/v1/wwg151repo/${encodeURIComponent(pkg.name)}/`, { mode: 'cors' });
                    if (!response.ok) continue;
                    const data = await response.json();
                    downloadCounts[pkg.name] = data.count || 0;
                    applyFilters();
                } catch (e) {}
            }
        }

        function openModal(id) {
            document.querySelectorAll('.modal-mask.show').forEach(modal => {
                if (modal.id !== id) closeModal(modal.id, false);
            });
            lastFocusedElement = document.activeElement;
            const mask = document.getElementById(id);
            mask.classList.add('show');
            mask.setAttribute('aria-hidden', 'false');
            document.body.classList.add('modal-open');
            requestAnimationFrame(() => mask.querySelector('button')?.focus());
        }

        function closeModal(id, restoreFocus = true) {
            const mask = document.getElementById(id);
            if (!mask) return;
            mask.classList.remove('show');
            mask.setAttribute('aria-hidden', 'true');
            if (id === 'detailModal') history.replaceState(null, '', location.pathname);
            if (!document.querySelector('.modal-mask.show')) {
                document.body.classList.remove('modal-open');
                if (restoreFocus && lastFocusedElement instanceof HTMLElement) lastFocusedElement.focus();
            }
        }

        function versionMarkup(pkg) {
            return pkg.versions.map((version, index) => {
                const size = version.downloadSize ? formatSize(version.downloadSize) : '';
                return `
                    <button class="version-item" type="button" data-version-index="${index}">
                        <span><span class="version-num">v${escapeHtml(version.version || '?')}${size ? ` · ${escapeHtml(size)}` : ''}</span><span class="version-arch" style="display:block">架构: ${escapeHtml(version.arch || '未知')}</span></span>
                        <span class="version-download-icon">${svgIcon('download')}</span>
                    </button>`;
            }).join('');
        }

        function showVersionModal(packageName) {
            const pkg = allPackages.find(item => item.name === packageName);
            if (!pkg || !pkg.versions.length) {
                showToast('暂无可下载版本');
                return;
            }
            currentVersionPkg = pkg;
            $('#versionModalTitle').textContent = `${pkg.displayName} - 选择版本`;
            $('#versionList').innerHTML = versionMarkup(pkg);
            openModal('versionModal');
        }

        function showDetailModal(packageName) {
            const pkg = allPackages.find(item => item.name === packageName);
            if (!pkg) return;
            currentDetailPkg = pkg;
            const latest = pkg.versions[0] || {};
            $('#detailIconWrap').innerHTML = renderIcon(pkg, true);
            $('#detailModalTitle').textContent = pkg.displayName;

            const dependencies = parseDepends(latest.depends);
            const dependenciesHtml = dependencies.length ? dependencies.map(dependency => {
                if (allPackages.some(item => item.name === dependency)) {
                    return `<button class="dep-link" type="button" data-dependency="${escapeHtml(dependency)}">${escapeHtml(dependency)}</button>`;
                }
                return `<span>${escapeHtml(dependency)}</span>`;
            }).join(', ') : '无';

            const screenshotsHtml = pkg.screenshots.length ? `
                <div class="detail-section"><div class="detail-label">截图</div><div class="screenshots">${pkg.screenshots.map(url => `<img src="${escapeHtml(url)}" alt="${escapeHtml(pkg.displayName)} 截图" loading="lazy" onerror="this.remove()">`).join('')}</div></div>` : '';

            $('#detailContent').innerHTML = `
                <div class="detail-section"><div class="detail-label">包名</div><div class="detail-value mono">${escapeHtml(pkg.name)}</div></div>
                <div class="detail-section"><div class="detail-label">描述</div><div class="detail-value">${escapeHtml(pkg.desc || '无描述')}</div></div>
                <div class="detail-grid">
                    <div class="detail-section"><div class="detail-label">分类</div><div class="detail-value">${escapeHtml(pkg.section)}</div></div>
                    <div class="detail-section"><div class="detail-label">作者</div><div class="detail-value">${escapeHtml(pkg.author || '未知')}</div></div>
                    <div class="detail-section"><div class="detail-label">下载大小</div><div class="detail-value">${escapeHtml(latest.downloadSize ? formatSize(latest.downloadSize) : '未知')}</div></div>
                    <div class="detail-section"><div class="detail-label">安装后大小</div><div class="detail-value">${escapeHtml(latest.installedSize ? formatInstalledSize(latest.installedSize) : '未知')}</div></div>
                </div>
                <div class="detail-section"><div class="detail-label">依赖</div><div class="detail-value">${dependenciesHtml}</div></div>
                ${screenshotsHtml}
                <div class="detail-section"><div class="detail-label">版本列表 (${pkg.versions.length})</div><div class="version-list" id="detailVersionList">${versionMarkup(pkg)}</div></div>`;
            openModal('detailModal');
            history.replaceState(null, '', '?pkg=' + encodeURIComponent(pkg.name));
        }

        function downloadFile(filename, packageName) {
            if (!filename) {
                showToast('下载地址未找到');
                return;
            }
            window.open(REPO_BASE + filename, '_blank', 'noopener');
            closeModal('versionModal', false);
            closeModal('detailModal', false);
            document.body.classList.remove('modal-open');
            showToast('开始下载...');
            if (packageName) {
                fetch(`https://api.counterapi.dev/v1/wwg151repo/${encodeURIComponent(packageName)}/up`, { mode: 'cors' }).catch(() => {});
            }
        }

        $('#themeToggle').addEventListener('click', toggleTheme);
        $('#copyUrlBtn').addEventListener('click', () => copyText($('#repoUrl').textContent, '已复制到剪贴板'));
        $('#copyDownloadBtn').addEventListener('click', () => {
            const latest = currentDetailPkg?.versions[0];
            if (!latest?.filename) {
                showToast('下载地址未找到');
                return;
            }
            copyText(REPO_BASE + latest.filename, '下载链接已复制');
        });
        $('#searchInput').addEventListener('input', applyFilters);
        $('#sectionFilter').addEventListener('change', applyFilters);
        $('#archFilter').addEventListener('change', applyFilters);
        document.querySelectorAll('.sort-btn').forEach(button => button.addEventListener('click', () => setSort(button.dataset.sort)));

        $('#pkgList').addEventListener('click', event => {
            const action = event.target.closest('[data-action]');
            if (!action) return;
            const packageName = action.closest('[data-package]')?.dataset.package;
            if (!packageName) return;
            if (action.dataset.action === 'detail') showDetailModal(packageName);
            if (action.dataset.action === 'download') showVersionModal(packageName);
        });

        $('#versionList').addEventListener('click', event => {
            const item = event.target.closest('[data-version-index]');
            if (!item || !currentVersionPkg) return;
            const version = currentVersionPkg.versions[Number(item.dataset.versionIndex)];
            if (version) downloadFile(version.filename, currentVersionPkg.name);
        });

        $('#detailContent').addEventListener('click', event => {
            const dependency = event.target.closest('[data-dependency]');
            if (dependency) {
                showDetailModal(dependency.dataset.dependency);
                return;
            }
            const item = event.target.closest('[data-version-index]');
            if (item && currentDetailPkg) {
                const version = currentDetailPkg.versions[Number(item.dataset.versionIndex)];
                if (version) downloadFile(version.filename, currentDetailPkg.name);
            }
        });

        document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => closeModal(button.dataset.close)));
        document.querySelectorAll('.modal-mask').forEach(mask => mask.addEventListener('click', event => {
            if (event.target === mask) closeModal(mask.id);
        }));
        document.addEventListener('keydown', event => {
            if (event.key !== 'Escape') return;
            const visibleModals = document.querySelectorAll('.modal-mask.show');
            if (visibleModals.length) closeModal(visibleModals[visibleModals.length - 1].id);
        });

        syncTheme();
        (async () => {
            await loadPkgDates();
            await loadPackages();
        })();
    </script>
</body>
</html>
