<!doctype html><html lang='zh-CN'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>插件详情</title><style>body{font:1rem system-ui;margin:1.5rem auto;max-width:46rem;padding:0 1rem}p{white-space:pre-wrap}</style><main></main><script>fetch('depiction.json').then(r=>r.json()).then(d=>{let m=document.querySelector('main');function add(tag,text){let e=document.createElement(tag);e.textContent=text;m.append(e)}for(let t of d.tabs){add('h1',t.tabname);for(let v of t.views||[])add(v.class==='DepictionHeaderView'?'h2':'p',[v.title,v.markdown,v.text].filter(Boolean).join(' '))}}).catch(()=>document.querySelector('main').textContent='无法加载详情')</script></html>
